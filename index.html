<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Smart User Search</title>
    <style>
      body {
        font-family: Arial, sans-serif;
      }

      #controls {
        margin-bottom: 10px;
      }

      #results {
        height: 200px;
        overflow-y: auto;
        border: 1px solid #ccc;
        padding: 10px;
      }

      .user {
        padding: 6px;
        border-bottom: 1px solid #eee;
      }

      mark {
        background-color: yellow;
        font-weight: bold;
      }

      button {
        margin-left: 5px;
      }
    </style>
  </head>
  <body>
    <h2>User Search</h2>

    <div id="controls">
      <input id="searchInput" placeholder="Search users..." />
      <button id="clearBtn">Clear</button>
    </div>

    <p id="status"></p>

    <div id="results"></div>

    <script src="script.js"></script>
  </body>
</html>
